[package]
name = "tempo"
version = "0.1.0"
description = "Tempo — one-tap time tracking with an Obsidian/WebDAV sync"
authors = ["Jakob Gabriel"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix keeps the desktop binary and the mobile library from
# colliding on Windows; `cdylib` is what the Android build links against.
name = "tempo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
thiserror = "2"
# rustls instead of native-tls: no OpenSSL to cross-compile for Android.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tauri-plugin-opener = "2.5.5"

[features]
# This feature is used for production builds where `devUrl` points to the
# filesystem. Do not remove it!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
