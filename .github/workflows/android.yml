name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main", "claude/**"]

concurrency:
  group: android-${{ github.ref }}
  # Queue rather than cancel. Cancelling meant a push during a build threw away
  # the only thing that build was for — the APK and its size — and the next run
  # started the release compile from scratch anyway.
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Empty unless the repository has signing secrets; decides release vs debug.
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      NDK_VERSION: "27.2.12479018"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Generate the Gradle project
        run: npx tauri android init --skip-targets-install

      - name: Install the ongoing-notification plugin
        run: node scripts/configure-android-notification.mjs

      - name: Trim the APK
        run: node scripts/configure-android-size.mjs

      # A release build is the whole difference between a 600 MB APK and a
      # small one: the debug build type keeps the native debug symbols, and an
      # unoptimized Rust library carrying them is ~225 MB per architecture.
      # Release needs a signing key, so if the repository has no secrets we
      # make one — that key differs per run, so a phone will refuse to install
      # over an APK from an earlier run. Add the secrets to keep one identity.
      - name: Provide a signing key
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > src-tauri/gen/android/keystore.jks
            # printf, not a heredoc: YAML indents the block, and an indented
            # heredoc terminator would never close.
            printf 'storeFile=keystore.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' \
              "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$ANDROID_STORE_PASSWORD" \
              > src-tauri/gen/android/keystore.properties
          else
            echo "::warning::No signing secrets — using a throwaway key. Uninstall any earlier build before installing this one."
            keytool -genkeypair -keystore src-tauri/gen/android/keystore.jks \
              -alias tempo -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tempo-ci -keypass tempo-ci -dname "CN=Tempo CI"
            printf 'storeFile=keystore.jks\nkeyAlias=tempo\nkeyPassword=tempo-ci\nstorePassword=tempo-ci\n' \
              > src-tauri/gen/android/keystore.properties
          fi
          node scripts/configure-signing.mjs

      - name: Build the APK
        run: npx tauri android build --apk --split-per-abi

      - name: Collect the APKs, and hold them to a budget
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          limit=$((50 * 1024 * 1024))
          over=0
          {
            echo "| APK | Size |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in artifacts/*.apk; do
            bytes=$(stat -c%s "$apk")
            human=$(numfmt --to=iec --format='%.1f' "$bytes")
            printf '| %s | %s |\n' "$(basename "$apk")" "$human" >> "$GITHUB_STEP_SUMMARY"
            echo "$(basename "$apk") — $human"
            if [ "$bytes" -gt "$limit" ]; then
              echo "::error::$(basename "$apk") is $human, over the 50 MB budget"
              over=1
            fi
          done
          exit "$over"

      - uses: actions/upload-artifact@v4
        with:
          name: tempo-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
